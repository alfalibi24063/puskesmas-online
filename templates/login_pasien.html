{% extends "base.html" %}

{% block konten %}
<div class="container vh-100">
    <div class="row justify-content-center align-items-center h-100">

        <div class="col-md-5">
            <div class="card shadow">

                <div class="card-header text-center">
                    <h3>Login Pasien</h3>
                </div>

                <div class="card-body">

                    {% if error %}
                    <div class="alert alert-danger text-center">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form action="{{ url_for('rpasien.login') }}" method="POST">

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   name="username"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="d-grid">
                            <button type="submit"
                                    class="btn btn-success">
                                Login
                            </button>
                        </div>

                    </form>

                    <!-- <hr>

                    <p class="text-center">
                        Belum punya akun?
                    </p>

                    <div class="d-grid">
                       <a href="{{ url_for('rpasien.register') }}" class="btn btn-success"></a>
                    </div> -->

                </div>
            </div>
        </div>

    </div>
</div>

{% endblock %}
